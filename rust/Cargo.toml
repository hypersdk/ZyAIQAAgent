[package]
name = "zyvor-qa-rust"
version = "0.1.0"
edition = "2021"
description = "High-throughput artifact processing for Zyvor QA Agent"

[[bin]]
name = "zyvor-diff"
path = "src/main.rs"

[dependencies]
image = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
