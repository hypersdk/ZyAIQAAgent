name: Security and Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e '.[dev]' mypy pip-audit bandit[toml] pytest-cov
      - run: ruff check .
      - run: mypy orchestrator agents --ignore-missing-imports
      # TODO: raise back toward 70% as test coverage improves. Raised 36 -> 40 after
      # the security-testing feature pass (engagements, misconfig_scan, cve_lookup,
      # llm_redteam, exploit_poc, attack_chain, host_pentest, cloud_pentest) added
      # its own coverage (~39% -> ~42% actual, 389 tests); see ROADMAP.md for the
      # next highest-leverage target (the ~30 job-runner functions themselves).
      - run: pytest tests/unit --cov=orchestrator --cov=agents --cov-report=term-missing --cov-fail-under=40
      - run: pip-audit
      - run: bandit -q -c pyproject.toml -r orchestrator agents -x tests

  node-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: |
          for f in playwright/scripts/*.mjs; do node --check "$f"; done

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.secure
          push: false
          load: true
          tags: zyvor-argus:test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zyvor-argus:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
