name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.1.0'
        required: true

env:
  IMAGE: ghcr.io/hypersdk/zyaiqaagent

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: ref
        run: echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ref.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate GitHub Action entrypoint
        run: |
          docker run --rm --entrypoint sh "${{ env.IMAGE }}:${{ steps.ref.outputs.tag }}" \
            -c "test -x /action-entrypoint.sh && echo action-entrypoint.sh OK"

  github-release:
    needs: publish-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-image.outputs.tag }}
          generate_release_notes: true
          body: |
            Image: `ghcr.io/hypersdk/zyaiqaagent:${{ needs.publish-image.outputs.tag }}`

            ```bash
            docker pull ghcr.io/hypersdk/zyaiqaagent:${{ needs.publish-image.outputs.tag }}
            ```
