apiVersion: v1
kind: Secret
metadata:
  name: argus-secrets
  labels:
    app: argus
type: Opaque
stringData:
  DASHBOARD_USER: "admin"
  DASHBOARD_PASSWORD: ""
  OPENAI_API_KEY: ""
  GITHUB_TOKEN: ""
  GITHUB_WEBHOOK_SECRET: ""
  ZYVOR_PRODUCT_REPO: "owner/zyvor-monorepo"
  SLACK_WEBHOOK_URL: ""
  TEAMS_WEBHOOK_URL: ""
  # Mounted as a file (see ZYVOR_API_TOKENS_FILE in deployment.yaml) — maps
  # SHA-256(token) -> {"subject": ..., "role": "viewer"|"operator"|"admin", "scopes": [...]}.
  # Generate tokens with `python tools/hash_api_token.py`; never store plaintext here.
  api-tokens.json: "{}"
