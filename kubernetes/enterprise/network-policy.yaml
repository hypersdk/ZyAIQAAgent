apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
