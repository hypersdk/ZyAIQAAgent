# Apply only when operators should be allowed to restart pods from Mission Control.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-pod-restarter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-pod-restarter
subjects:
  - kind: ServiceAccount
    name: argus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-pod-restarter
