apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus
  labels:
    app: argus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-dashboard-reader
  labels:
    app: argus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]   # delete = dashboard pod-restart button
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-dashboard-reader
  labels:
    app: argus
subjects:
  - kind: ServiceAccount
    name: argus
roleRef:
  kind: Role
  name: argus-dashboard-reader
  apiGroup: rbac.authorization.k8s.io
