apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zyvor-qa-webhook
  labels:
    app: zyvor-qa-agent
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    # CHANGE ME: replace with your own ingress hostname before applying.
    - host: qa-webhook.example.com
      http:
        paths:
          - path: /webhook/github
            pathType: Prefix
            backend:
              service:
                name: zyvor-qa-webhook
                port:
                  number: 80
